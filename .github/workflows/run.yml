name: Run MyWhoosh2Garmin

on:
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Seconds to wait before syncing (set by the Strava webhook)"
        required: false
        default: "0"

# Never run two syncs at once (stops duplicate uploads if two events arrive together)
concurrency:
  group: mywhoosh2garmin
  cancel-in-progress: false

jobs:
  run-myWhoosh2Garmin:
    name: Run MyWhoosh2Garmin
    runs-on: ubuntu-slim
    steps:
      - name: Wait for Strava to finish processing
        if: ${{ inputs.delay_seconds != '' && inputs.delay_seconds != '0' }}
        run: sleep ${{ inputs.delay_seconds }}

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install project (from pyproject.toml)
        shell: bash
        run: |
          uv sync --frozen

      - name: Run myWhoosh2Garmin.py
        shell: bash
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_ACCESS_TOKEN: ${{ secrets.STRAVA_ACCESS_TOKEN }}
          STRAVA_EXPIRES_AT: ${{ secrets.STRAVA_EXPIRES_AT }}
          STRAVA_EXPIRES_IN: ${{ secrets.STRAVA_EXPIRES_IN }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          ATHLETE_FTP: ${{ vars.ATHLETE_FTP }}
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python myWhoosh2Garmin.py


